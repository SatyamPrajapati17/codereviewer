[project]
name = "reviewguard"
version = "0.1.0"
description = "AI-powered code review and security assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "python-gitlab>=4.11.0",
    "PyGithub>=2.4.0",
    "unidiff>=0.7.5",
    "semgrep>=1.90.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.3.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT", "T10", "T20", "SIM", "PIE", "PL", "PTH", "ERA", "RET", "NPY", "ARG"]
ignore = ["S101", "S311", "PLW0511", "T201", "T203", "PTH118", "PTH119", "PTH120", "PTH123", "ERA001", "ARG001", "ARG002"]
per-file-ignores = {"tests/*": ["S101", "S311", "T201", "T203"]}

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]